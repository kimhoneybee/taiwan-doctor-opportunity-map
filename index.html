<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>台灣醫師兼職・合作・合夥＋高齡照護機會地圖</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;color:#172033}*{box-sizing:border-box}.app{height:100%;display:grid;grid-template-columns:390px 1fr}.side{overflow:auto;border-right:1px solid #e2e8f0;background:#fff}.head,.controls{padding:14px 16px;border-bottom:1px solid #e2e8f0}h1{font-size:20px;margin:0 0 6px}.sub,.small{font-size:12px;color:#64748b;line-height:1.5}.status{margin-top:10px;padding:8px;border:1px solid #e2e8f0;border-radius:8px;background:#f8fafc;font-size:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}input,select,button{width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:8px;background:#fff}.checks{display:flex;gap:10px;font-size:13px;flex-wrap:wrap}.checks label{display:flex;gap:4px;align-items:center}.oppbox{padding:9px;border:1px solid #fecdd3;background:#fff7f8;border-radius:9px;margin:10px 0}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.metric{padding:7px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px}.metric b{display:block}.metric span{font-size:10px;color:#64748b}.results{padding:10px}.card{border:1px solid #e2e8f0;border-radius:9px;padding:9px;margin-bottom:8px;font-size:12px;line-height:1.45;cursor:pointer}.card.opp{border-color:#fecdd3;background:#fffafb}.name{font-weight:700;font-size:14px}.tag{display:inline-block;padding:2px 6px;border-radius:999px;margin:3px 3px 3px 0;font-size:10px;background:#ffe4e6;color:#9f1239}.tag.partner{background:#fef3c7;color:#92400e}.tag.new{background:#e0f2fe;color:#075985}.tag.care{background:#ccfbf1;color:#115e59}.section{font-weight:800;font-size:12px;color:#475569;margin:10px 2px 7px}.source{color:#be123c;font-weight:700}#map{height:100%}.clinic{width:13px;height:13px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px #64748b}.family{background:#2563eb}.rehab{background:#059669}.neuro{background:#db2777}.both{background:#7c3aed}.oppmark{width:24px;height:24px;border:2px solid white;border-radius:50% 50% 50% 6px;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px #64748b;background:#e11d48}.oppmark.partner{background:#f59e0b}.oppmark.new{background:#0ea5e9}.oppmark.care{background:#0f766e}.oppmark span{transform:rotate(45deg);color:white;font-weight:800}.leaflet-popup-content{min-width:250px;max-width:340px;font-size:12px;line-height:1.5}.actions a{display:inline-block;margin:5px 5px 0 0;padding:4px 7px;border:1px solid #cbd5e1;border-radius:6px;text-decoration:none;color:#0f172a}@media(max-width:760px){.app{grid-template-columns:1fr;grid-template-rows:50% 50%}.side{border-right:0;border-bottom:1px solid #e2e8f0}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
<div class="head"><h1>台灣醫師兼職・合作・合夥＋高齡照護機會地圖</h1><div class="sub">全台家醫／復健／神經內科診所底圖，加上公開兼職、支援、合夥、入股、新據點，以及護理之家／長照巡診合作線索。</div><div id="status" class="status">載入中…</div></div>
<div class="controls">
<div class="checks"><label><input id="family" type="checkbox" checked>家醫科</label><label><input id="rehab" type="checkbox" checked>復健科</label><label><input id="neuro" type="checkbox" checked>神經內科</label><label><input id="eldercare" type="checkbox" checked>高齡照護／長照</label></div>
<div class="oppbox"><b>醫師機會層</b><div class="checks" style="margin-top:7px"><label><input id="showOpp" type="checkbox" checked>顯示機會</label></div><select id="oppType"><option value="">全部機會</option><option value="parttime">兼職／支援</option><option value="partnership">合作／合夥／入股</option><option value="newsite">新診所／新據點</option><option value="startup">開業培訓</option><option value="carelead">巡診／特約合作線索</option></select></div>
<div class="row"><select id="county"><option value="">全台灣</option></select><input id="search" placeholder="搜尋診所、地址、聯絡人…"></div>
<div class="row"><button id="fit">縮放到結果</button><button id="export">匯出機會 CSV</button></div>
<div class="summary"><div class="metric"><b id="oppN">0</b><span>公開機會</span></div><div class="metric"><b id="clinicN">0</b><span>診所點位</span></div><div class="metric"><b id="date">—</b><span>機會更新</span></div></div>
</div>
<div id="results" class="results"></div>
</aside>
<main id="map"></main>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
(function(){
"use strict";
var ARC="https://services7.arcgis.com/tVmMUEViFfyHBZvj/ArcGIS/rest/services/hospital_tw/FeatureServer/0/query";
var GEO="https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/findAddressCandidates";
var counties=["臺北市","新北市","桃園市","臺中市","臺南市","高雄市","基隆市","新竹市","嘉義市","新竹縣","苗栗縣","彰化縣","南投縣","雲林縣","嘉義縣","屏東縣","宜蘭縣","花蓮縣","臺東縣","澎湖縣","金門縣","連江縣"];
var map=L.map("map").setView([23.75,121],7);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
var clinicLayer=L.markerClusterGroup({chunkedLoading:true,maxClusterRadius:50}).addTo(map);
var oppLayer=L.layerGroup().addTo(map);
var clinics=[],opps=[],updated="";
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s||"").replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]})}
function norm(s){return String(s||"").replace(/臺/g,"台").replace(/\s+/g,"").toLowerCase()}
function setStatus(s){$("status").innerHTML=s}
async function getJSON(u){var r=await fetch(u,{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}
function spec(p){var d=String(p["診療科別"]||"");return{family:/家醫科|家庭醫學科/.test(d),rehab:/復健科/.test(d),neuro:/神經內科|神經科/.test(d),departments:d}}
async function loadClinics(){
 var feats=[],offset=0;
 while(true){
  setStatus("載入全台家醫／復健／神經內科診所點位… "+feats.length.toLocaleString());
  var q=new URLSearchParams({where:"診療科別 LIKE '%家醫科%' OR 診療科別 LIKE '%復健科%' OR 診療科別 LIKE '%神經科%' OR 診療科別 LIKE '%神經內科%'",outFields:"醫療院所,縣市,鄉鎮市區,地址,電話,負責人,型態別,診療科別",returnGeometry:"true",f:"geojson",outSR:"4326",resultOffset:String(offset),resultRecordCount:"1000"});
  var js=await getJSON(ARC+"?"+q.toString()),b=js.features||[];feats=feats.concat(b);if(b.length<1000)break;offset+=b.length;if(offset>12000)break;
 }
 clinics=feats.map(function(f){var p=f.properties||{},c=f.geometry&&f.geometry.coordinates,s=spec(p);return{name:p["醫療院所"]||"",county:String(p["縣市"]||"").replace(/台/g,"臺"),district:p["鄉鎮市區"]||"",address:p["地址"]||"",phone:p["電話"]||"",responsible:p["負責人"]||"",departments:s.departments,family:s.family,rehab:s.rehab,neuro:s.neuro,lng:c?+c[0]:null,lat:c?+c[1]:null}}).filter(function(x){return x.lat&&x.lng});
}
async function loadOpps(){
 var js=await getJSON("./opportunities.json?v="+Date.now());opps=Array.isArray(js)?js:(js.opportunities||[]);updated=js.updatedAt||"";
 await Promise.all(opps.map(async function(o){if(Number.isFinite(o.lat)&&Number.isFinite(o.lng))return;try{var q=new URLSearchParams({SingleLine:o.address||o.name,countryCode:"TWN",maxLocations:"1",outSR:"4326",f:"json"}),j=await getJSON(GEO+"?"+q.toString()),c=j.candidates&&j.candidates[0];if(c&&c.location){o.lng=+c.location.x;o.lat=+c.location.y}}catch(e){}}));
}
function allowedCategory(x){return($("family").checked&&x.family)||($("rehab").checked&&x.rehab)||($("neuro").checked&&x.neuro)||($("eldercare").checked&&x.eldercare)}
function clinicFiltered(){var c=$("county").value,q=norm($("search").value);return clinics.filter(function(x){return allowedCategory(x)&&(!c||x.county===c)&&(!q||norm([x.name,x.address,x.phone,x.responsible,x.departments].join(" ")).indexOf(q)>=0)})}
function oppFiltered(){if(!$("showOpp").checked)return[];var c=$("county").value,t=$("oppType").value,q=norm($("search").value);return opps.filter(function(x){return allowedCategory(x)&&(!c||x.county===c)&&(!t||(x.types||[]).indexOf(t)>=0)&&(!q||norm([x.name,x.address,x.specialties,x.institutionType,x.contact,x.details,x.partnership].join(" ")).indexOf(q)>=0)})}
function clinicIcon(x){var n=(x.family?1:0)+(x.rehab?1:0)+(x.neuro?1:0),cl=n>1?"both":x.neuro?"neuro":x.family?"family":"rehab";return L.divIcon({className:"",html:'<div class="clinic '+cl+'"></div>',iconSize:[13,13],iconAnchor:[6,6]})}
function oppClass(o){return(o.types||[]).indexOf("carelead")>=0?"care":(o.types||[]).indexOf("partnership")>=0?"partner":(o.types||[]).indexOf("newsite")>=0?"new":"parttime"}
function oppIcon(o){var cl=oppClass(o),sym=cl==="partner"?"★":cl==="new"?"+":cl==="care"?"護":"醫";return L.divIcon({className:"",html:'<div class="oppmark '+cl+'"><span>'+sym+'</span></div>',iconSize:[26,26],iconAnchor:[13,24]})}
function oppTags(o){var a=[];(o.types||[]).forEach(function(t){a.push('<span class="tag '+(t==="partnership"||t==="startup"?"partner":t==="newsite"?"new":t==="carelead"?"care":"")+'">'+({parttime:"兼職/支援",partnership:"合作/合夥",newsite:"新據點",startup:"開業培訓",carelead:"巡診合作線索"}[t]||t)+'</span>')});return a.join("")}
function popupClinic(x){return'<b>'+esc(x.name)+'</b><br>'+esc(x.departments)+'<br>'+esc(x.address)+'<br>'+esc(x.phone)+(x.responsible?'<br>負責人線索：'+esc(x.responsible)+'<br><small>負責人來源為較舊空間資料，請再確認。</small>':"")}
function popupOpp(o){var g="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(o.address||o.name);return'<b>★ '+esc(o.name)+'</b><br>'+oppTags(o)+'<br><b>'+esc(o.typeLabel)+'</b><br>'+esc(o.details)+'<br><b>待遇/診次：</b>'+esc(o.compensation||"—")+'<br><b>合作訊號：</b>'+esc(o.partnership||"—")+'<br><b>聯絡：</b>'+esc([o.contact,o.phone,o.email].filter(Boolean).join("｜")||"由原始來源聯絡")+'<br><b>機構類型：</b>'+esc(o.institutionType||"—")+'<br><b>更新：</b>'+esc(o.sourceDate||"")+'｜'+esc(o.source||"")+'<div class="actions"><a target="_blank" href="'+esc(o.sourceUrl)+'">原始來源</a>'+(o.website?'<a target="_blank" href="'+esc(o.website)+'">官網</a>':"")+'<a target="_blank" href="'+g+'">Google 地圖</a></div>'}
function render(fit){
 var cf=clinicFiltered(),of=oppFiltered();clinicLayer.clearLayers();oppLayer.clearLayers();var all=[];
 cf.forEach(function(x){var m=L.marker([x.lat,x.lng],{icon:clinicIcon(x),title:x.name}).bindPopup(popupClinic(x));clinicLayer.addLayer(m);all.push(m)});
 of.forEach(function(o){if(Number.isFinite(o.lat)&&Number.isFinite(o.lng)){var m=L.marker([o.lat,o.lng],{icon:oppIcon(o),title:o.name}).bindPopup(popupOpp(o));oppLayer.addLayer(m);all.push(m)}});
 $("oppN").textContent=of.length;$("clinicN").textContent=cf.length.toLocaleString();$("date").textContent=updated||"—";
 var html='<div class="section">公開醫師機會／長照合作線索（'+of.length+'）</div>';
 of.forEach(function(o){html+='<div class="card opp" data-oid="'+esc(o.id)+'"><div class="name">★ '+esc(o.name)+'</div>'+oppTags(o)+'<div>'+esc(o.specialties||"")+'｜'+esc(o.county||"")+' '+esc(o.district||"")+'</div><div>'+esc(o.details||"")+'</div><div><b>聯絡：</b>'+esc([o.contact,o.phone,o.email].filter(Boolean).join("｜")||"請看來源")+'</div><a class="source" target="_blank" href="'+esc(o.sourceUrl)+'">'+esc(o.source||"原始來源")+' ↗</a></div>'});
 html+='<div class="section">診所底圖（'+cf.length.toLocaleString()+'）</div>';
 cf.slice(0,150).forEach(function(x,i){html+='<div class="card" data-ci="'+i+'"><div class="name">'+esc(x.name)+'</div><div>'+esc(x.departments)+'</div><div class="small">'+esc(x.address)+'<br>'+esc(x.phone)+'</div></div>'});
 $("results").innerHTML=html;
 if(fit&&all.length){var g=L.featureGroup(all);map.fitBounds(g.getBounds().pad(.06),{maxZoom:13})}
}
function fillCounties(){var s=new Set();clinics.forEach(function(x){if(x.county)s.add(x.county)});opps.forEach(function(x){if(x.county)s.add(x.county)});$("county").innerHTML='<option value="">全台灣</option>'+counties.filter(function(c){return s.has(c)}).map(function(c){return'<option>'+c+'</option>'}).join("")}
function exportOpp(){var rows=oppFiltered(),h=["名稱","縣市","行政區","機構類型","需求科別","機會型態","內容","待遇/診次","合作訊號","聯絡人","電話","Email","網站","團隊","規模","來源","來源日期","來源URL"],lines=[h.join(",")];function q(v){v=String(v==null?"":v);return/[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}rows.forEach(function(o){lines.push([o.name,o.county,o.district,o.institutionType,o.specialties,o.typeLabel,o.details,o.compensation,o.partnership,o.contact,o.phone,o.email,o.website,o.pt,o.scale,o.source,o.sourceDate,o.sourceUrl].map(q).join(","))});var b=new Blob(["\ufeff"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="台灣醫師機會_"+(updated||new Date().toISOString().slice(0,10))+".csv";a.click()}
["family","rehab","neuro","eldercare","showOpp","county","oppType"].forEach(function(id){$(id).addEventListener("change",function(){render(true)})});$("search").addEventListener("input",function(){render(false)});$("fit").onclick=function(){render(true)};$("export").onclick=exportOpp;
(async function(){try{await Promise.all([loadClinics(),loadOpps()]);fillCounties();render(true);setStatus("完成：診所點位 "+clinics.length.toLocaleString()+"；醫師機會 "+opps.length+"。機會資料更新："+(updated||"未標示")+"。")}catch(e){console.error(e);setStatus("載入失敗："+esc(e.message)+"。可重新整理頁面再試。")}})();
})();
</script>
</body>
</html>
