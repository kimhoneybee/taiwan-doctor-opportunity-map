<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>台灣醫師兼職・合作・合夥＋高齡照護機會地圖</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;color:#172033;background:#f6f8fb}
*{box-sizing:border-box}
button,input,select{font:inherit}
button{cursor:pointer}
.page{height:100%;display:flex;flex-direction:column;min-height:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:18px 28px;background:#114b5b;color:#fff;border-bottom:0;min-height:96px}
.title-wrap{min-width:0}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;color:#a9d6dc;text-transform:uppercase;margin-bottom:4px}
h1{font-size:24px;line-height:1.2;margin:0;color:#fff}
.sub{font-size:12px;color:#c7e3e7;line-height:1.5;margin-top:5px}
.header-actions{display:flex;gap:8px;flex:0 0 auto}
.header-actions button,.filter-actions button{width:auto;border:1px solid #cbd5e1;border-radius:9px;background:#fff;padding:8px 11px;color:#0f172a}
.header-actions .primary{background:#dff4f1;color:#124b5a;border-color:#dff4f1;font-weight:800}
.filterbar{padding:18px 28px 14px;background:#fff;border-bottom:1px solid #dbe3e8;box-shadow:0 1px 4px rgba(15,23,42,.05);z-index:6}
.filter-grid{display:grid;grid-template-columns:minmax(300px,1fr) 160px 150px 190px 175px;gap:12px;align-items:center}
input,select{width:100%;padding:9px 10px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;color:#0f172a;outline:none}
input:focus,select:focus{border-color:#64748b;box-shadow:0 0 0 3px rgba(100,116,139,.12)}
.checks{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.checks label{display:inline-flex;gap:6px;align-items:center;padding:7px 9px;border:1px solid #e2e8f0;border-radius:999px;background:#f8fafc;font-size:12px;white-space:nowrap}
.checks input{width:auto;margin:0}
.filter-lower{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:10px}
.filter-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.summary{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:12px;color:#64748b}
.metric b{color:#0f172a;font-size:15px;margin-right:4px}
.status{padding:7px 28px;background:#f7fafb;border-bottom:1px solid #e5e7eb;font-size:11px;color:#64748b}
.workspace{flex:1;min-height:0;display:grid;grid-template-columns:minmax(430px,500px) minmax(0,1fr);gap:0;background:#fff}
.workspace.map-hidden{grid-template-columns:1fr}
.workspace.map-hidden .map-panel{display:none}
.results-panel{min-width:0;overflow:auto;background:#f5f8fa;border-right:1px solid #dbe3e8}
.results-head{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px 18px;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid #e5e7eb}
.results-head h2{margin:0;font-size:15px}
.results-head .small{font-size:11px;color:#64748b}
.results{padding:14px 18px 28px;display:block}
.card{background:#fff;border:1px solid #dce5ea;border-radius:12px;padding:15px 16px;box-shadow:0 1px 2px rgba(15,23,42,.03);font-size:12px;line-height:1.55;cursor:pointer;transition:.15s ease;min-width:0;margin-bottom:11px}
.card:hover{border-color:#94a3b8;box-shadow:0 5px 16px rgba(15,23,42,.07);transform:translateY(-1px)}
.card-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.name{font-weight:800;font-size:15px;line-height:1.35;color:#0f172a}
.loc{font-size:11px;color:#64748b;margin-top:2px}
.tags{margin:7px 0 4px}
.tag{display:inline-block;padding:2px 7px;border-radius:999px;margin:2px 4px 2px 0;font-size:10px;background:#ffe4e6;color:#9f1239;font-weight:700}
.tag.partner{background:#fef3c7;color:#92400e}
.tag.new{background:#e0f2fe;color:#075985}
.tag.care{background:#ccfbf1;color:#115e59}
.tag.full{background:#e0e7ff;color:#3730a3}
.card-detail{margin-top:7px;color:#334155}
.card-detail b{color:#0f172a}
.card-meta{margin-top:9px;padding-top:8px;border-top:1px solid #f1f5f9;display:flex;justify-content:space-between;gap:8px;align-items:end}
.source{color:#be123c;font-weight:700;text-decoration:none}
.source:hover{text-decoration:underline}
.empty{grid-column:1/-1;background:#fff;border:1px dashed #cbd5e1;border-radius:12px;padding:30px;text-align:center;color:#64748b}
.map-panel{min-width:0;background:#fff;display:flex;flex-direction:column}
.map-head{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid #e5e7eb;font-size:12px}
.map-head b{font-size:13px}
.map-head button{width:auto;border:1px solid #cbd5e1;border-radius:8px;background:#fff;padding:6px 8px}
#map{flex:1;min-height:360px}
.clinic{width:13px;height:13px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px #64748b}.family{background:#2563eb}.rehab{background:#059669}.neuro{background:#db2777}.both{background:#7c3aed}
.oppmark{width:24px;height:24px;border:2px solid white;border-radius:50% 50% 50% 6px;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px #64748b;background:#e11d48}.oppmark.partner{background:#f59e0b}.oppmark.new{background:#0ea5e9}.oppmark.care{background:#0f766e}.oppmark span{transform:rotate(45deg);color:white;font-weight:800}
.leaflet-popup-content{min-width:250px;max-width:340px;font-size:12px;line-height:1.5}.actions a{display:inline-block;margin:5px 5px 0 0;padding:4px 7px;border:1px solid #cbd5e1;border-radius:6px;text-decoration:none;color:#0f172a}
.small{font-size:11px;color:#64748b}
@media(max-width:1100px){
  .filter-grid{grid-template-columns:minmax(220px,1fr) 145px 165px}
  
  .workspace{grid-template-columns:minmax(380px,430px) minmax(0,1fr)}
}
@media(max-width:820px){
  .page{height:auto;min-height:100%}
  .topbar{padding:14px 16px;align-items:flex-start;min-height:auto}
  h1{font-size:18px}
  .sub{display:none}
  .header-actions .primary{display:none}
  .filterbar{padding:10px 14px}
  .filter-grid{grid-template-columns:1fr 1fr}
  .filter-grid #search{grid-column:1/-1}
  
  .filter-lower{align-items:flex-start;flex-direction:column}
  .summary{gap:10px}
  .status{padding:6px 14px}
  .workspace,.workspace.map-hidden{display:flex;flex-direction:column;min-height:0}
  .map-panel{display:none;border-left:0;border-bottom:1px solid #e5e7eb;height:44vh;min-height:310px;order:-1}
  .workspace.map-open .map-panel{display:flex}
  .results-panel{overflow:visible}
  .results-head{top:0}
  .results{grid-template-columns:1fr;padding:12px 14px 24px}
}
</style>
</head>

<body>
<div class="page">
  <header class="topbar">
    <div class="title-wrap">
      <div class="eyebrow">Taiwan Physician Opportunities</div>
      <h1>台灣醫師機會地圖</h1>
      <div class="sub">兼職・合作・合夥・高齡照護｜整合職缺、支援、專任、新據點與長照巡診線索。</div>
    </div>
    <div class="header-actions">
      <button id="toggleMap">隱藏地圖</button>
      <button id="export" class="primary">匯出 CSV</button>
    </div>
  </header>

  <section class="filterbar">
    <div class="filter-grid">
      <input id="search" placeholder="搜尋診所、科別、地區、聯絡人…">
      <select id="specialty">
        <option value="">全部科別</option>
        <option value="neuro">神經內科／神經科</option>
        <option value="family">家醫科</option>
        <option value="rehab">復健科</option>
        <option value="internal">內科／次專科</option>
        <option value="peds">小兒科</option>
        <option value="ent">耳鼻喉科</option>
        <option value="emergency">急診科</option>
        <option value="other">其他科別</option>
      </select>
      <select id="county"><option value="">全台灣</option></select>
      <select id="oppType">
        <option value="">全部機會類型</option>
        <option value="parttime">兼職／支援</option>
        <option value="fulltime">專任／全職</option>
        <option value="partnership">合作／合夥／入股</option>
        <option value="carelead">巡診／特約／顧問</option>
        <option value="takeover">診所接手／頂讓</option>
        <option value="newsite">新診所／新據點</option>
        <option value="startup">開業培訓</option>
      </select>
      <select id="institution">
        <option value="">全部機構</option>
        <option value="clinic">診所</option>
        <option value="hospital">醫院</option>
        <option value="group">醫療集團／體系</option>
        <option value="ltc">護理之家／長照</option>
        <option value="other">其他機構</option>
      </select>
    </div>
    <div class="filter-lower">
      <div class="filter-actions">
        <button id="reset">清除篩選</button>
        <button id="fit">地圖縮放到結果</button>
      </div>
      <div class="summary">
        <span class="metric"><b id="oppN">0</b>醫師機會</span>
        <span class="metric"><b id="clinicN">0</b>診所點位</span>
        <span class="metric"><b id="date">—</b>更新</span>
      </div>
    </div>
  </section>

  <div id="status" class="status">載入中…</div>

  <main id="workspace" class="workspace">
    <section class="results-panel">
      <div class="results-head">
        <div>
          <h2>符合條件的醫師機會</h2>
          <div class="small">點選卡片可在地圖定位；地圖只作輔助，不再佔主要版面。</div>
        </div>
      </div>
      <div id="results" class="results"></div>
    </section>

    <section id="mapPanel" class="map-panel">
      <div class="map-head">
        <div><b>地圖</b><div class="small">醫師機會＋診所底圖</div></div>
        <button id="collapseMap">收起</button>
      </div>
      <div id="map"></div>
    </section>
  </main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
(function(){
"use strict";
var ARC="https://services7.arcgis.com/tVmMUEViFfyHBZvj/ArcGIS/rest/services/hospital_tw/FeatureServer/0/query";
var GEO="https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/findAddressCandidates";
var counties=["臺北市","新北市","桃園市","臺中市","臺南市","高雄市","基隆市","新竹市","嘉義市","新竹縣","苗栗縣","彰化縣","南投縣","雲林縣","嘉義縣","屏東縣","宜蘭縣","花蓮縣","臺東縣","澎湖縣","金門縣","連江縣"];
var map=L.map("map").setView([23.75,121],7);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
var clinicLayer=L.markerClusterGroup({chunkedLoading:true,maxClusterRadius:50}).addTo(map);
var oppLayer=L.layerGroup().addTo(map);
var clinics=[],opps=[],updated="";
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s||"").replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]})}
function norm(s){return String(s||"").replace(/臺/g,"台").replace(/\s+/g,"").toLowerCase()}
function setStatus(s){$("status").innerHTML=s}
async function getJSON(u){var r=await fetch(u,{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}
function spec(p){var d=String(p["診療科別"]||"");return{family:/家醫科|家庭醫學科/.test(d),rehab:/復健科/.test(d),neuro:/神經內科|神經科/.test(d),departments:d}}
async function loadClinics(){
 var feats=[],offset=0;
 while(true){
  setStatus("載入全台家醫／復健／神經內科診所點位… "+feats.length.toLocaleString());
  var q=new URLSearchParams({where:"診療科別 LIKE '%家醫科%' OR 診療科別 LIKE '%復健科%' OR 診療科別 LIKE '%神經科%' OR 診療科別 LIKE '%神經內科%'",outFields:"醫療院所,縣市,鄉鎮市區,地址,電話,負責人,型態別,診療科別",returnGeometry:"true",f:"geojson",outSR:"4326",resultOffset:String(offset),resultRecordCount:"1000"});
  var js=await getJSON(ARC+"?"+q.toString()),b=js.features||[];feats=feats.concat(b);if(b.length<1000)break;offset+=b.length;if(offset>12000)break;
 }
 clinics=feats.map(function(f){var p=f.properties||{},c=f.geometry&&f.geometry.coordinates,s=spec(p);return{name:p["醫療院所"]||"",county:String(p["縣市"]||"").replace(/台/g,"臺"),district:p["鄉鎮市區"]||"",address:p["地址"]||"",phone:p["電話"]||"",responsible:p["負責人"]||"",departments:s.departments,institutionType:p["型態別"]||"",family:s.family,rehab:s.rehab,neuro:s.neuro,lng:c?+c[0]:null,lat:c?+c[1]:null}}).filter(function(x){return x.lat&&x.lng});
}
async function loadOpps(){
 var js=await getJSON("./opportunities.json?v="+Date.now());opps=Array.isArray(js)?js:(js.opportunities||[]);updated=js.updatedAt||"";
 await Promise.all(opps.map(async function(o){if(Number.isFinite(o.lat)&&Number.isFinite(o.lng))return;try{var q=new URLSearchParams({SingleLine:o.address||o.name,countryCode:"TWN",maxLocations:"1",outSR:"4326",f:"json"}),j=await getJSON(GEO+"?"+q.toString()),c=j.candidates&&j.candidates[0];if(c&&c.location){o.lng=+c.location.x;o.lat=+c.location.y}}catch(e){}}));
}
function specialtyMatch(x,s){
 if(!s)return true;
 var d=String(x.specialties||x.departments||"");
 if(s==="neuro")return !!x.neuro||/神經內科|神經科|神內/.test(d);
 if(s==="family")return !!x.family||/家醫科|家庭醫學科/.test(d);
 if(s==="rehab")return !!x.rehab||/復健科/.test(d);
 if(s==="internal")return /內科|新陳代謝|心臟|腸胃|胃腸|腎臟|胸腔|內分泌/.test(d);
 if(s==="peds")return /小兒科|兒科/.test(d);
 if(s==="ent")return /耳鼻喉/.test(d);
 if(s==="emergency")return /急診/.test(d);
 if(s==="other")return !(/神經內科|神經科|神內|家醫科|家庭醫學科|復健科|內科|新陳代謝|心臟|腸胃|胃腸|腎臟|胸腔|內分泌|小兒科|兒科|耳鼻喉|急診/.test(d));
 return true;
}
function institutionGroup(x){
 var t=String(x.institutionType||"");
 if(x.eldercare||/長照|護理之家|安養|住宿式/.test(t))return "ltc";
 if(/集團|體系|聯盟/.test(t))return "group";
 if(/診所/.test(t))return "clinic";
 if(/醫院|醫療中心/.test(t))return "hospital";
 return "other";
}
function clinicFiltered(){var c=$("county").value,s=$("specialty").value,i=$("institution").value,q=norm($("search").value);return clinics.filter(function(x){return specialtyMatch(x,s)&&(!c||x.county===c)&&(!i||institutionGroup(x)===i)&&(!q||norm([x.name,x.address,x.phone,x.responsible,x.departments,x.institutionType].join(" ")).indexOf(q)>=0)})}
function oppFiltered(){var c=$("county").value,s=$("specialty").value,i=$("institution").value,t=$("oppType").value,q=norm($("search").value);return opps.filter(function(x){return specialtyMatch(x,s)&&(!c||x.county===c)&&(!i||institutionGroup(x)===i)&&(!t||(x.types||[]).indexOf(t)>=0)&&(!q||norm([x.name,x.address,x.specialties,x.institutionType,x.contact,x.details,x.partnership].join(" ")).indexOf(q)>=0)}).sort(function(a,b){return String(b.sourceDate||"").localeCompare(String(a.sourceDate||""))})}
function clinicIcon(x){var n=(x.family?1:0)+(x.rehab?1:0)+(x.neuro?1:0),cl=n>1?"both":x.neuro?"neuro":x.family?"family":"rehab";return L.divIcon({className:"",html:'<div class="clinic '+cl+'"></div>',iconSize:[13,13],iconAnchor:[6,6]})}
function oppClass(o){return(o.types||[]).indexOf("carelead")>=0?"care":(o.types||[]).indexOf("partnership")>=0?"partner":(o.types||[]).indexOf("newsite")>=0?"new":"parttime"}
function oppIcon(o){var cl=oppClass(o),sym=cl==="partner"?"★":cl==="new"?"+":cl==="care"?"護":"醫";return L.divIcon({className:"",html:'<div class="oppmark '+cl+'"><span>'+sym+'</span></div>',iconSize:[26,26],iconAnchor:[13,24]})}
function oppTags(o){var a=[];(o.types||[]).forEach(function(t){a.push('<span class="tag '+(t==="partnership"||t==="startup"?"partner":t==="newsite"?"new":t==="carelead"?"care":t==="fulltime"?"full":"")+'">'+({parttime:"兼職/支援",fulltime:"專任/全職",partnership:"合作/合夥",newsite:"新據點",startup:"開業培訓",carelead:"巡診／特約",takeover:"接手／頂讓"}[t]||t)+'</span>')});return a.join("")}
function popupClinic(x){return'<b>'+esc(x.name)+'</b><br>'+esc(x.departments)+'<br>'+esc(x.address)+'<br>'+esc(x.phone)+(x.responsible?'<br>負責人線索：'+esc(x.responsible)+'<br><small>負責人來源為較舊空間資料，請再確認。</small>':"")}
function popupOpp(o){var g="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(o.address||o.name);return'<b>★ '+esc(o.name)+'</b><br>'+oppTags(o)+'<br><b>'+esc(o.typeLabel)+'</b><br>'+esc(o.details)+'<br><b>待遇/診次：</b>'+esc(o.compensation||"—")+'<br><b>合作訊號：</b>'+esc(o.partnership||"—")+'<br><b>聯絡：</b>'+esc([o.contact,o.phone,o.email].filter(Boolean).join("｜")||"由原始來源聯絡")+'<br><b>機構類型：</b>'+esc(o.institutionType||"—")+'<br><b>刊登日期：</b>'+esc(o.sourceDate||"")+'｜'+esc(o.source||"")+'<div class="actions"><a target="_blank" href="'+esc(o.sourceUrl)+'">原始來源</a>'+(o.website?'<a target="_blank" href="'+esc(o.website)+'">官網</a>':"")+'<a target="_blank" href="'+g+'">Google 地圖</a></div>'}
function render(fit){
 var cf=clinicFiltered(),of=oppFiltered();clinicLayer.clearLayers();oppLayer.clearLayers();var all=[];
 cf.forEach(function(x){var m=L.marker([x.lat,x.lng],{icon:clinicIcon(x),title:x.name}).bindPopup(popupClinic(x));clinicLayer.addLayer(m);all.push(m)});
 of.forEach(function(o){if(Number.isFinite(o.lat)&&Number.isFinite(o.lng)){var m=L.marker([o.lat,o.lng],{icon:oppIcon(o),title:o.name}).bindPopup(popupOpp(o));oppLayer.addLayer(m);all.push(m)}});
 $("oppN").textContent=of.length;$("clinicN").textContent=cf.length.toLocaleString();$("date").textContent=updated||"—";
 var html="";
 if(!of.length){
   html='<div class="empty"><b>目前沒有符合條件的醫師機會</b><br><span class="small">可以放寬科別、縣市或機會類型再試一次。</span></div>';
 }else{
   of.forEach(function(o){
     html+='<article class="card opp" data-oid="'+esc(o.id)+'">'+
       '<div class="card-top"><div><div class="name">'+esc(o.name)+'</div><div class="loc">'+esc([o.county,o.district].filter(Boolean).join(" "))+' · '+esc(o.institutionType||"醫療院所")+'</div></div></div>'+
       '<div class="tags">'+oppTags(o)+'</div>'+
       '<div><b>'+esc(o.typeLabel||o.specialties||"醫師機會")+'</b></div>'+
       '<div class="card-detail">'+esc(o.details||"")+'</div>'+
       (o.compensation?'<div class="card-detail"><b>待遇／診次：</b>'+esc(o.compensation)+'</div>':"")+
       (o.partnership?'<div class="card-detail"><b>合作訊號：</b>'+esc(o.partnership)+'</div>':"")+
       '<div class="card-detail"><b>刊登日期：</b>'+esc(o.sourceDate||"—")+'</div>'+
       '<div class="card-meta"><div><b>聯絡：</b>'+esc([o.contact,o.phone,o.email].filter(Boolean).join("｜")||"請看原始來源")+'</div>'+
       '<a class="source" target="_blank" href="'+esc(o.sourceUrl)+'">'+esc(o.source||"原始來源")+' ↗</a></div>'+
       '</article>';
   });
 }
 $("results").innerHTML=html;
 if(fit&&all.length){var g=L.featureGroup(all);map.fitBounds(g.getBounds().pad(.06),{maxZoom:13})}
}
function fillCounties(){var s=new Set();clinics.forEach(function(x){if(x.county)s.add(x.county)});opps.forEach(function(x){if(x.county)s.add(x.county)});$("county").innerHTML='<option value="">全台灣</option>'+counties.filter(function(c){return s.has(c)}).map(function(c){return'<option>'+c+'</option>'}).join("")}
function exportOpp(){var rows=oppFiltered(),h=["名稱","縣市","行政區","機構類型","需求科別","機會型態","內容","待遇/診次","合作訊號","聯絡人","電話","Email","網站","團隊","規模","來源","來源日期","來源URL"],lines=[h.join(",")];function q(v){v=String(v==null?"":v);return/[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}rows.forEach(function(o){lines.push([o.name,o.county,o.district,o.institutionType,o.specialties,o.typeLabel,o.details,o.compensation,o.partnership,o.contact,o.phone,o.email,o.website,o.pt,o.scale,o.source,o.sourceDate,o.sourceUrl].map(q).join(","))});var b=new Blob(["\ufeff"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="台灣醫師機會_"+(updated||new Date().toISOString().slice(0,10))+".csv";a.click()}
["specialty","county","oppType","institution"].forEach(function(id){$(id).addEventListener("change",function(){render(true)})});$("search").addEventListener("input",function(){render(false)});$("fit").onclick=function(){render(true)};$("export").onclick=exportOpp;
function setMapVisible(show){
 var w=$("workspace");
 if(window.innerWidth<=820){
   w.classList.toggle("map-open",show);
 }else{
   w.classList.toggle("map-hidden",!show);
 }
 $("toggleMap").textContent=show?"隱藏地圖":"顯示地圖";
 setTimeout(function(){map.invalidateSize()},120);
}
$("toggleMap").onclick=function(){
 var w=$("workspace"),visible=window.innerWidth<=820?w.classList.contains("map-open"):!w.classList.contains("map-hidden");
 setMapVisible(!visible);
};
$("collapseMap").onclick=function(){setMapVisible(false)};
$("reset").onclick=function(){
 $("specialty").value="";$("county").value="";$("oppType").value="";$("institution").value="";$("search").value="";
 render(true);
};
$("results").addEventListener("click",function(e){
 var card=e.target.closest("[data-oid]");
 if(!card||e.target.closest("a"))return;
 var o=opps.find(function(x){return x.id===card.getAttribute("data-oid")});
 if(!o||!Number.isFinite(o.lat)||!Number.isFinite(o.lng))return;
 setMapVisible(true);
 setTimeout(function(){map.setView([o.lat,o.lng],14);oppLayer.eachLayer(function(m){if(m.options&&m.options.title===o.name)m.openPopup()})},150);
});
if(window.innerWidth<=820)setMapVisible(false);
(async function(){try{await Promise.all([loadClinics(),loadOpps()]);fillCounties();render(true);setStatus("完成：診所點位 "+clinics.length.toLocaleString()+"；醫師機會 "+opps.length+"。機會資料更新："+(updated||"未標示")+"。")}catch(e){console.error(e);setStatus("載入失敗："+esc(e.message)+"。可重新整理頁面再試。")}})();
})();
</script>
